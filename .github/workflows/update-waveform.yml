name: Update waveform stats

on:
  push:
    branches: [main]
    paths:
      - 'stats.json'
      - 'scripts/generate_waveform.py'
  schedule:
    - cron: '0 6 * * *'   # daily safety-net run, in case the manual trigger is missed
  workflow_dispatch: {}    # lets you trigger it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate waveform-stats.svg from stats.json
        run: python scripts/generate_waveform.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add waveform-stats.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh waveform-stats.svg [skip ci]"
            git push
          fi
