name: Update GitHub tenure waveform

on:
  schedule:
    - cron: '0 6 * * *'   # daily -- picks up any repo you pushed in the last 24h
  workflow_dispatch: {}    # manual "run now" button in the Actions tab, for right after a new push

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate waveform-stats.svg from live repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_waveform.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add waveform-stats.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh waveform-stats.svg from live repos [skip ci]"
            git push
          fi
