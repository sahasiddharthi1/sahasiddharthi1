name: GitHub Snake

on:
  schedule:
    - cron: '0 * * * *'  # Runs hourly
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install snake game
        run: |
          pip install snake-game-generator
      - name: Generate snake SVG
        run: |
          snake-game-generator \
            --username sahasiddharthi1 \
            --theme dracula \
            --output .github/snake.svg
      - name: Commit snake SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/snake.svg
          git commit -m "chore: update snake game"
          git push