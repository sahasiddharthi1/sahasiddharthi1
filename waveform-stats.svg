  </filter>
</defs>
<rect x="0" y="0" width="900" height="240" rx="16" fill="#040711" stroke="#0d2847" stroke-width="1.5"/>
<text x="90" y="104" text-anchor="middle" font-family="monospace" font-size="11" fill="#3a5570">ACCOUNT CREATED</text>
